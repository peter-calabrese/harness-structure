version: 1
checks:
  pull_request:
    - id: validate-standards
      command: "npm run validate:standards"
      required: true
    - id: validate-agents
      command: "npm run validate:agents"
      required: true
    - id: validate-skills
      command: "npm run validate:skills"
      required: true
    - id: check-drift
      command: "npm run check-drift"
      required: true
    - id: harness-tests
      command: "npm test"
      required: true
